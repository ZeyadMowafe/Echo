flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.
  
  background_image: "assets/images/gradient_background_light.jpg"
  background_image_dark: "assets/images/gradient_background_dark.jpg"

  image: assets/images/splash_icon_light.png
  image_dark: assets/images/splash_icon_dark.png

  android_12:
    color: "#E9EBE9"
    color_dark: "#0D1215"
    image: assets/images/splash_icon_light_android12.png
    image_dark: assets/images/splash_icon_dark_android12.png